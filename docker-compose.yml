services:
  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      NEXT_PUBLIC_SOCKET_URL: http://localhost:4000
    depends_on: [api]
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    ports: ["4000:4000"]
    env_file: .env
    depends_on: [redis]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
